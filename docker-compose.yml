version: '3.8'

services:
  zenlove-wedding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenlove-wedding-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - ADMIN_PASSCODE=ZenLove_SecAdmin_2026_xK9#
      - ADMIN_SESSION_SECRET=zenlove_production_secret_session_key_2026_super_secure
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
