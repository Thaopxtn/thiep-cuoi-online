version: '3.8'

services:
  zenlove-wedding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenlove-wedding-platform
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - ADMIN_PASSCODE=${ADMIN_PASSCODE:?Set ADMIN_PASSCODE before starting Compose}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?Set a random ADMIN_SESSION_SECRET before starting Compose}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
